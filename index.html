<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Prome</title>
<style>
:root{
  --bg:#f5f3ff; --card:#ffffff; --text:#1f1a3d; --muted:#6f6a92; --line:#e9e4fc;
  --primary:#7c5cff; --primary-soft:#efeaff; --pink:#ff4d9d; --ok:#12b76a; --ok-soft:#e3f8ee;
  --warn:#f79009; --warn-soft:#fff3e0; --bad:#f04438; --bad-soft:#ffebe9;
  --grad:linear-gradient(135deg,#7c5cff 0%,#b04cff 50%,#ff4d9d 100%);
  --radius:18px; --shadow:0 2px 6px rgba(80,50,180,.06),0 8px 24px rgba(80,50,180,.08);
  --c:#7c5cff; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  -webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* Un solo contenedor de scroll: evita saltos/rebotes al deslizar en el celular */
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(90px + env(safe-area-inset-bottom))}
a{color:var(--primary)}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:1.15rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:12px;border:none;
  background:var(--card);color:var(--text);font-size:1.25rem;text-decoration:none;cursor:pointer;box-shadow:var(--shadow)}
main{max-width:680px;margin:0 auto;padding:14px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.empty{text-align:center;padding:40px 10px}
.empty .big{font-size:3rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:.95rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:.85rem}
.btn.block{display:flex;width:100%;margin-top:14px}
.link{background:none;border:none;color:var(--primary);font-weight:600;font-size:.85rem;padding:4px 0;cursor:pointer}
.link.danger{color:var(--bad)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));padding:14px 24px;border-radius:999px;
  border:none;background:var(--primary);color:#fff;font-weight:700;font-size:1rem;box-shadow:0 6px 20px rgba(79,70,229,.35);cursor:pointer}

/* lista de cursos */
.list{display:flex;flex-direction:column;gap:10px}
.course-row{display:block;background:var(--card);border-radius:var(--radius);padding:14px;text-decoration:none;color:var(--text);box-shadow:var(--shadow);border:1px solid var(--line)}
.cr-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cr-name{font-weight:700;font-size:1.02rem}
.cr-meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:8px;gap:8px;flex-wrap:wrap}
.chip{font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--primary-soft);color:var(--primary)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.none{background:var(--line);color:var(--muted)}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:var(--primary);transition:width .3s}
.bar.ok>div{background:var(--ok)}

/* resumen del curso */
.summary{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.sum-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.sum-top .label{font-size:.82rem;color:var(--muted)}
.sum-top .bigpct{font-size:2.2rem;font-weight:800;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats>div{background:var(--bg);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats span{font-size:.7rem;color:var(--muted)} .stats b{font-size:1.15rem} .stats small{font-size:.68rem;color:var(--muted)}
.need-msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.9rem;background:var(--primary-soft)}
.need-msg.ok{background:var(--ok-soft)} .need-msg.bad{background:var(--bad-soft)} .need-msg.warn{background:var(--warn-soft)}
.need-msg + .need-msg{margin-top:8px}
.alert{padding:11px 13px;border-radius:12px;font-size:.88rem;margin-bottom:14px}
.alert.warn{background:var(--warn-soft);color:var(--text);border:1px solid var(--warn)}

/* árbol de notas */
.tree{display:flex;flex-direction:column;gap:10px}
.group{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.group .group{box-shadow:none;border-radius:10px;margin:0}
.group-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;background:var(--primary-soft)}
.group .group .group-head{background:var(--bg)}
.group-name{font-weight:700}
.group-val{text-align:right;font-weight:700;font-size:.95rem;white-space:nowrap}
.group-val small{display:block;font-weight:500;font-size:.7rem;color:var(--muted)}
.group-body{padding:8px;display:flex;flex-direction:column;gap:8px}
.leaf{display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.tree>.leaf{box-shadow:var(--shadow)}
.leaf.locked{border-color:var(--ok);background:var(--ok-soft)}
.leaf-info{flex:1;min-width:0}
.leaf-name{font-weight:600}
.leaf-w{font-size:.72rem;color:var(--muted)}
.need{font-size:.74rem;font-weight:600;color:var(--primary);margin-top:2px}
.need.bad{color:var(--bad)} .need.ok{color:var(--ok)}
input{font:inherit;color:var(--text)}
input.grade{width:74px;height:44px;text-align:center;font-size:1.1rem;font-weight:700;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
input.grade:focus{outline:none;border-color:var(--primary)}
input.grade:disabled{opacity:1;-webkit-text-fill-color:var(--ok);color:var(--ok);border-color:var(--ok);background:transparent}
input.grade.invalid{border-color:var(--bad)}
input.grade.wide{width:100%;margin-top:6px}
.lock-btn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:1.1rem;cursor:pointer}
.lock-btn:disabled{border-color:var(--ok);background:transparent;cursor:default}

/* configuración */
.card{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:10px}
label input,.cfg-name,.cfg-w{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 11px;font-size:1rem;width:100%}
label input:focus,.cfg-name:focus,.cfg-w:focus{outline:none;border-color:var(--primary)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 label{margin-bottom:0}
.section-title{font-size:1rem;margin:20px 0 4px}
.cfg-list{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line)}
.cfg-list .cfg-list{background:var(--bg);margin-top:8px;padding:8px;border-left:3px solid var(--primary)}
/* Nivel principal: cada evaluación en su propio recuadro, separado */
.cfg-list.root{background:none;border:none;padding:0;gap:14px;margin-top:10px}
.cfg-list.root>.cfg-node{padding:14px;border-radius:var(--radius);box-shadow:var(--shadow)}
.cfg-list.root>.cfg-node>.cfg-row .cfg-name{font-weight:700}
.cfg-list.root>.cfg-foot{padding:4px 2px}
.cfg-node{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.cfg-row{display:flex;gap:8px;align-items:center}
.cfg-name{flex:1;min-width:0}
.pct{display:flex;align-items:center;gap:4px;width:96px;flex-shrink:0}
.pct .cfg-w{text-align:right;padding:0 8px}
.pct span{color:var(--muted);font-weight:700}
.cfg-actions{display:flex;gap:16px;align-items:center;margin-top:6px}
.tag{font-size:.75rem;color:var(--ok);font-weight:700}
.cfg-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cfg-foot-btns{display:flex;gap:6px;margin-left:auto}
.sum{font-size:.8rem;font-weight:700}
.sum.ok{color:var(--ok)} .sum.bad{color:var(--bad)}
.danger-zone{margin-top:26px;text-align:center}

/* modal y toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,25,.5);display:flex;align-items:flex-end;justify-content:center;padding:14px}
.modal[hidden]{display:none}
@media (min-width:600px){.modal{align-items:center}}
.modal-box{width:100%;max-width:440px;background:var(--card);border-radius:18px;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.modal-box h3{margin:0 0 8px}
.modal-box p{margin:6px 0}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal-actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:600;max-width:90vw;text-align:center}
.toast[hidden]{display:none}

/* cuadros de las secciones principales */
.heads-title{font-size:.78rem;color:var(--muted);font-weight:700;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.03em}
.heads{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.head-card{background:var(--bg);border-radius:10px;padding:10px;border:1.5px solid transparent;min-width:0}
.head-card .hc-name{font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-card .hc-w{font-size:.68rem;color:var(--muted)}
.head-card .hc-val{font-size:1.5rem;font-weight:800;margin-top:2px}
.head-card .hc-sub{font-size:.68rem;color:var(--muted)}
.head-card.ok{border-color:var(--ok)} .head-card.ok .hc-val{color:var(--ok)}
.head-card.bad{border-color:var(--bad)} .head-card.bad .hc-val{color:var(--bad)}
.head-card.partial .hc-val{color:var(--muted)}

/* candado: mantener presionado para desbloquear */
.lock-btn{position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lock-btn.on{border-color:var(--ok);background:var(--ok-soft)}
.lock-btn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(220,38,38,.35)}
.lock-btn.holding::after{height:100%;transition:height var(--hold,2s) linear}
input.grade.is-locked{-webkit-text-fill-color:var(--ok);color:var(--ok);border-color:var(--ok);background:transparent;caret-color:transparent}

/* reordenar bloques */
.cfg-head{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cfg-head input{-webkit-user-select:text;user-select:text}
.grip{display:inline-flex;align-items:center;justify-content:center;width:26px;height:42px;flex-shrink:0;color:var(--muted);
  font-size:1.1rem;cursor:grab;touch-action:none;margin-left:-4px}
.cfg-node.dragging{outline:2px solid var(--primary);box-shadow:0 10px 30px rgba(79,70,229,.25)!important;opacity:.95;position:relative;z-index:5}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
.cfg-tools{display:flex;gap:8px;margin-top:14px}
.cfg-tools .btn{flex:1}

/* ciclos, menú y cierre */
.list-title{font-size:.78rem;color:var(--muted);font-weight:700;margin:4px 2px 10px;text-transform:uppercase;letter-spacing:.03em}
.cycle-row .chev{font-size:1.5rem;color:var(--muted);line-height:1}
.cycle-row .cr-top{margin-bottom:4px}
.course-row.closed{background:var(--bg)}
.modal-actions:empty{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit;cursor:pointer}
.tile:active{border-color:var(--primary);background:var(--primary-soft)}
.tile .ti{font-size:1.6rem}
.tile b{font-size:1rem}
.tile small{font-size:.74rem;color:var(--muted);line-height:1.3}
.check-list{max-height:45vh;overflow-y:auto;overscroll-behavior:contain;margin-top:4px}
.check{flex-direction:row;align-items:center;gap:10px;font-size:.95rem;color:var(--text);font-weight:500;margin:0;padding:10px 4px;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;accent-color:var(--primary);flex-shrink:0}
.check.all{font-weight:700;border-bottom:2px solid var(--line)}
.check-head{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin:12px 0 2px}
.closed-banner{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius);margin-bottom:14px;border:1.5px solid}
.closed-banner .big{font-size:2rem}
.closed-banner.ok{background:var(--ok-soft);border-color:var(--ok)} .closed-banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.close-box{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding:14px;border-radius:var(--radius);background:var(--ok-soft);border:1.5px solid var(--ok)}
.close-btn{background:var(--ok);border-color:var(--ok);color:#fff}

/* solo vertical */
.rotate{display:none}
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){
  .rotate{display:flex;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
  .rotate .big{font-size:3rem}
}

/* ================= Tema con más vida ================= */
[hidden]{display:none!important}
body{background:radial-gradient(1200px 500px at 100% -10%,#ffe3f1 0%,transparent 60%),radial-gradient(900px 500px at -10% 0%,#e6e0ff 0%,transparent 55%),var(--bg)}
.top{background:rgba(255,255,255,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(124,92,255,.12)}
.top h1{font-weight:800}
.brand{display:inline-flex;align-items:center;gap:8px}
.brand .logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;background:var(--grad);font-size:1.1rem;box-shadow:0 4px 12px rgba(176,76,255,.35)}
.brand-name{font-size:1.45rem;font-weight:900;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{background:#fff;border:1px solid var(--line)}
.hello{margin:6px 2px 18px}
.hello-t{font-size:1.6rem;font-weight:900;letter-spacing:-.02em}
.hello-s{color:var(--muted);font-weight:600}
.list-title{color:var(--text);font-size:.85rem;letter-spacing:.02em}
.list{gap:12px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.pop{animation:pop .35s ease both}
.list>.pop:nth-child(2){animation-delay:.04s}.list>.pop:nth-child(3){animation-delay:.08s}.list>.pop:nth-child(4){animation-delay:.12s}.list>.pop:nth-child(n+5){animation-delay:.16s}

.btn{border-radius:14px}
.btn.primary,.btn.grad{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(176,76,255,.3)}
.btn.grad{font-size:1.02rem;padding:14px 18px}
.btn:active,.tile:active{transform:scale(.97)}
.fab{z-index:30}
.fab:active{transform:translateX(-50%) scale(.97)}
.fab{background:var(--grad);box-shadow:0 10px 26px rgba(176,76,255,.45);font-size:1.02rem}
.link{color:var(--c)}

/* ciclos */
.cycle-row{display:flex;align-items:center;gap:10px;padding:16px;border-radius:var(--radius);cursor:pointer;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#ff4d9d));box-shadow:0 10px 24px color-mix(in srgb,var(--c) 35%,transparent)}
.cycle-row::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.cy-main{flex:1;min-width:0}
.cy-name{font-size:1.25rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cy-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cy-meta span{background:rgba(255,255,255,.22);padding:4px 9px;border-radius:999px;font-size:.75rem;font-weight:700}
.cy-edit{position:relative;z-index:1;width:40px;height:40px;border-radius:12px;border:none;background:rgba(255,255,255,.25);font-size:1rem;cursor:pointer}
.cycle-row .chev{position:relative;z-index:1;font-size:1.8rem;color:#fff;opacity:.9}
.cycle-title{display:block;width:100%;background:none;border:1.5px dashed var(--line);border-radius:12px;padding:8px;color:var(--muted);font:inherit;font-size:.8rem;font-weight:600;margin-bottom:14px;cursor:pointer}

/* cursos */
.course-row{border:none;border-left:6px solid var(--c);border-radius:var(--radius)}
.course-row .cr-name{font-size:1.08rem}
.course-row.closed{background:#fff;opacity:.92}
.bar{height:10px;background:var(--primary-soft)}
.bar>div{background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 50%,#ff4d9d))}
.bar.ok>div{background:linear-gradient(90deg,#12b76a,#34d399)}
.chip{background:var(--primary-soft);color:var(--primary)}
.chip.mid{background:#e8f1ff;color:#2563eb}

/* resumen */
.summary{background:transparent;border:none;box-shadow:none;padding:0}
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:18px;box-shadow:0 14px 30px rgba(176,76,255,.35);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .sum-top .label{color:rgba(255,255,255,.9);font-weight:700}
.hero .bigpct{font-size:2.8rem}
.hero .chip{background:rgba(255,255,255,.95);position:relative}
.hero .bar{background:rgba(255,255,255,.3)}
.hero .bar>div,.hero .bar.ok>div{background:#fff}
.hero .stats>div{background:rgba(255,255,255,.18);border-radius:12px}
.hero .stats span,.hero .stats small{color:rgba(255,255,255,.85)}
.heads-title{color:var(--text);margin-top:18px}
.head-card{background:#fff;border:none;border-top:5px solid var(--c);box-shadow:var(--shadow);border-radius:14px}
.head-card.ok{border-top-color:var(--c);background:linear-gradient(180deg,#fff,var(--ok-soft))}
.head-card.bad{border-top-color:var(--c);background:linear-gradient(180deg,#fff,var(--bad-soft))}
.head-card .hc-val{font-size:1.8rem}
.need-msg{background:#fff;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.need-msg.ok{background:#fff;border-left-color:var(--ok)} .need-msg.bad{background:#fff;border-left-color:var(--bad)} .need-msg.warn{background:#fff;border-left-color:var(--warn)}
#summary{margin-bottom:16px}

/* bloques del curso */
.group{border:none}
.group.blk{border-left:6px solid var(--c)}
.group.blk>.group-head{background:color-mix(in srgb,var(--c) 14%,#fff)}
.group.blk>.group-head .group-name{color:color-mix(in srgb,var(--c) 75%,#000)}
.group .group{border:1px solid color-mix(in srgb,var(--c) 25%,#fff);border-left:3px solid var(--c);border-radius:12px}
.group .group .group-head{background:color-mix(in srgb,var(--c) 6%,#fff)}
.group .group-body .group{border-right:none;border-radius:12px 0 0 12px;margin-right:-8px}
.group .group .group-body{padding-right:8px}
.group-val{color:color-mix(in srgb,var(--c) 75%,#000)}
.leaf{border-color:var(--line)}
.leaf.blk{border:none;border-left:6px solid var(--c);border-radius:var(--radius)}

input.grade{border-radius:12px;background:#f8f6ff}
input.grade:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
.lock-btn{border-radius:12px;background:#fff}
.lock-btn.on{background:linear-gradient(135deg,#12b76a,#34d399);border-color:transparent}
.closed-banner{border-radius:20px}

/* configuración */
.card{border:none}

/* Subdivisiones: barra solo a la izquierda y usan todo el ancho hacia la derecha */
.cfg-node .cfg-list{margin:10px -10px 0 -2px;padding:8px 0 4px 8px;background:transparent;border:none;border-left:3px solid var(--c);border-radius:0}
.cfg-list.root>.cfg-node.blk>.cfg-list{margin-right:-14px}

.cfg-node .cfg-list .pct{width:84px}
.start-card{text-align:center;background:#fff;border-radius:22px;padding:26px 18px;box-shadow:var(--shadow);border:2px dashed color-mix(in srgb,var(--primary) 35%,#fff)}
.start-card .big{font-size:2.6rem}

</style>
</head>
<body>
<div id="scroller">
<header class="top">
  <a id="back" class="icon-btn" hidden aria-label="Volver">‹</a>
  <h1 id="title">Prome</h1>
  <div id="topActions"></div>
</header>
<main id="app"></main>
</div>
<button class="fab" id="fab" hidden></button>
<div class="rotate"><div class="big">📱</div><b>Gira tu teléfono</b><span class="muted">Esta app se usa solo en vertical.</span></div>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="modal-actions" id="mActions"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" multiple hidden>

<script>
/* ============ Datos ============ */
const KEY = 'misNotas.v1';
const EPS = 0.01;
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.cycles)) return s;
    // Versión anterior (sin ciclos): pasa los cursos a un ciclo
    if (s && Array.isArray(s.courses)) return { cycles: s.courses.length ? [{ id: uid(), name: 'Mi ciclo', courses: s.courses }] : [] };
  } catch (e) {}
  return { cycles: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('No se pudo guardar en este dispositivo'); }
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round2 = n => Math.round(n * 100) / 100;
const fmt = (n, d = 2) => (n == null || !isFinite(n)) ? '—' : n.toLocaleString('es-PE', { maximumFractionDigits: d, minimumFractionDigits: 0 });
const parseNum = v => {
  if (v == null) return null;
  v = String(v).trim().replace(',', '.');
  if (v === '') return null;
  const n = Number(v);
  return isFinite(n) ? n : NaN;
};
/* Colores para diferenciar cada bloque principal */
const COLORS = ['#7c5cff', '#ff4d9d', '#14b8c4', '#ff9f1c', '#22c55e', '#3b82f6', '#f43f5e', '#a855f7'];
const colorAt = i => COLORS[i % COLORS.length];
const isLeaf = n => !n.children || n.children.length === 0;
const newNode = (name, weight) => ({ id: uid(), name, weight, children: [], grade: null, locked: false });
const allCourses = () => state.cycles.flatMap(y => y.courses);
const findCourse = id => allCourses().find(c => c.id === id);
const findCycle = id => state.cycles.find(y => y.id === id);
const cycleOf = c => state.cycles.find(y => y.courses.includes(c));

function findNode(list, id, parent = null) {
  for (const n of list) {
    if (n.id === id) return { node: n, parent, list };
    const r = findNode(n.children || [], id, n);
    if (r) return r;
  }
  return null;
}
function getList(c, pid) { return pid === 'root' ? c.items : findNode(c.items, pid).node.children; }
function hasLocked(n) { return n.locked || (n.children || []).some(hasLocked); }

/* Nombre para una evaluación nueva: toma el nombre de la última del grupo y le sube el número.
   "Laboratorio 1" → "Laboratorio 2", "EA5" → "EA6", "Parcial" → "Parcial 1". */
function nextName(list) {
  if (!list.length) return 'Evaluación 1';
  const last = String(list[list.length - 1].name || '').trim() || 'Evaluación';
  const m = last.match(/^(.*?)(\s*)(\d+)$/);
  const base = m ? m[1] : last;
  const sep = m ? m[2] : ' ';
  // Evita repetir: busca el número más alto con esa misma base dentro del grupo
  let max = 0;
  for (const n of list) {
    const nm = String(n.name || '').trim();
    const mm = nm.match(/^(.*?)\s*(\d+)$/);
    if (mm && mm[1].trim() === base.trim()) max = Math.max(max, Number(mm[2]));
  }
  return `${base}${sep}${max + 1}`;
}

/* Evaluaciones finales (las que llevan nota) con su peso efectivo sobre el curso */
function leaves(list, factor = 1, out = []) {
  for (const n of list) {
    const ew = factor * (Number(n.weight) || 0) / 100;
    if (isLeaf(n)) out.push({ node: n, ew });
    else leaves(n.children, ew, out);
  }
  return out;
}
const sumW = list => list.reduce((a, n) => a + (Number(n.weight) || 0), 0);

function weightIssues(list, label = 'Nivel principal', out = []) {
  if (list.length) { const s = sumW(list); if (Math.abs(s - 100) > EPS) out.push({ label, sum: s }); }
  for (const n of list) if (!isLeaf(n)) weightIssues(n.children, n.name || '(sin nombre)', out);
  return out;
}

/* ============ Cálculos ============ */
/* Redondeo de las secciones principales: 10.5 → 11, 10.4 → 10 */
const roundHalf = x => Math.floor(x + 0.5 + 1e-9);
const hasGrade = n => n.grade != null && isFinite(n.grade);

/* Información de una sección principal (cabeza) */
function headInfo(n) {
  const ls = leaves([n]);
  let tw = 0, fp = 0, fw = 0, lp = 0, lw = 0;
  for (const { node, ew } of ls) {
    tw += ew;
    if (hasGrade(node)) { fp += node.grade * ew; fw += ew; if (node.locked) { lp += node.grade * ew; lw += ew; } }
  }
  const complete = tw > 1e-12 && fw >= tw - 1e-9;
  const lockedAll = tw > 1e-12 && lw >= tw - 1e-9;
  return {
    n, ls, tw, fp, fw, lp, lw, complete, lockedAll,
    raw: complete ? fp / tw : (fw > 1e-12 ? fp / fw : null),   // con decimales
    rounded: complete ? roundHalf(fp / tw) : null,              // redondeada
    frac: tw > 1e-12 ? fw / tw : 0
  };
}

function calc(c) {
  const heads = c.items.map(headInfo);
  const ls = heads.flatMap(h => h.ls);
  let lockedPts = 0, lockedW = 0, filledPts = 0, filledW = 0, totalW = 0;
  for (const h of heads) {
    totalW += h.tw; filledW += h.fw; lockedW += h.lw;
    // Sección completa: cuenta su nota redondeada; si no, lo que lleva
    filledPts += h.complete ? h.rounded * h.tw : h.fp;
    lockedPts += h.lockedAll ? roundHalf(h.lp / h.tw) * h.tw : h.lp;
  }
  const remW = totalW - lockedW, emptyW = totalW - filledW;
  const needLocked = remW > 1e-9 ? (c.pass - lockedPts) / remW : null;   // promedio necesario en lo NO asegurado
  const needEmpty = emptyW > 1e-9 ? (c.pass - filledPts) / emptyW : null; // promedio necesario en lo vacío (con simulaciones)
  const progress = c.pass > 0 ? Math.min(1, Math.max(0, lockedPts / c.pass)) : 0;
  let status;
  if (c.closed) status = filledPts >= c.pass - 1e-9 ? { k: 'ok', t: 'Cerrado · Aprobado' } : { k: 'bad', t: 'Cerrado · Desaprobado' };
  else if (!ls.length) status = { k: 'none', t: 'Sin configurar' };
  else if (lockedPts >= c.pass - 1e-9) status = { k: 'ok', t: 'Aprobado asegurado' };
  else if (remW <= 1e-9) status = { k: 'bad', t: 'Desaprobado' };
  else if (needLocked > c.max + 1e-9) status = { k: 'bad', t: 'Ya no alcanza' };
  else if (needLocked > c.max * 0.7) status = { k: 'warn', t: 'En riesgo' };
  else status = { k: 'mid', t: 'En curso' };
  return { heads, ls, lockedPts, lockedW, filledPts, filledW, totalW, remW, emptyW, needLocked, needEmpty, progress, status };
}

const isComplete = c => { const r = calc(c); return r.ls.length > 0 && r.emptyW <= 1e-9; };

/* Promedio de un grupo según lo llenado (frac = parte del grupo que ya tiene nota) */
function groupValue(n) {
  if (isLeaf(n)) return (n.grade != null && isFinite(n.grade)) ? { val: n.grade, frac: 1 } : { val: null, frac: 0 };
  let pts = 0, w = 0, tw = 0;
  for (const ch of n.children) {
    const cw = (Number(ch.weight) || 0) / 100; tw += cw;
    const r = groupValue(ch);
    if (r.val != null) { pts += r.val * cw * r.frac; w += cw * r.frac; }
  }
  return { val: w > 1e-9 ? pts / w : null, frac: tw > 0 ? w / tw : 0 };
}

/* ============ UI base ============ */
function setHeader(title, backHref, actions = '', brand = false) {
  const t = $('#title');
  if (brand) t.innerHTML = `<span class="brand"><span class="logo">🎯</span><span class="brand-name">${esc(title)}</span></span>`;
  else t.textContent = title;
  $('.top').classList.toggle('home', brand);
  const b = $('#back');
  if (backHref) { b.hidden = false; b.href = backHref; } else b.hidden = true;
  $('#topActions').innerHTML = actions;
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400);
}
let modalGen = 0;
function modal({ title, body, actions }) {
  const gen = ++modalGen;
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = body;
  const a = $('#mActions'); a.innerHTML = '';
  actions.forEach(act => {
    const b = document.createElement('button');
    b.className = 'btn' + (act.primary ? ' primary' : '') + (act.danger ? ' danger' : '');
    b.textContent = act.t;
    if (act.primary) b.dataset.primary = '1';
    b.onclick = () => {
      if (act.fn) { const r = act.fn(); if (r === false) return; }
      if (modalGen === gen) closeModal();
    };
    a.appendChild(b);
  });
  $('#modal').hidden = false;
  const f = $('#mBody input');
  if (f) setTimeout(() => f.focus(), 60);
}
function closeModal() { $('#modal').hidden = true; modalGen++; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#mBody').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const p = $('#mActions [data-primary]'); if (p) p.click(); }
});

/* ============ Router ============ */
function setFab(label, fn) { const f = $('#fab'); f.textContent = label; f.onclick = fn; f.hidden = false; }
let draft = null;   // curso nuevo que aún no se guarda: { cycleId, course }
function route() {
  const p = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  if (p[0] !== 'nuevo') draft = null;
  $('#fab').hidden = true;          // salir sin guardar = no se guarda nada
  if (p[0] === 'nuevo') {
    if (draft) renderConfig(draft.course); else { location.replace('#/'); renderCycles(); }
  } else if (p[0] === 'curso' && findCourse(p[1])) {
    const c = findCourse(p[1]);
    if (p[2] === 'config' && !c.closed) renderConfig(c); else renderCourse(c);
  } else if (p[0] === 'ciclo' && findCycle(p[1])) renderCycle(findCycle(p[1]));
  else renderCycles();
  $('#scroller').scrollTop = 0;
}
/* Volver a dibujar sin perder la posición del scroll */
function keepScroll(fn) { const s = $('#scroller'), y = s.scrollTop; fn(); s.scrollTop = y; }
window.addEventListener('hashchange', route);

/* ============ Inicio: ciclos ============ */
function renderCycles() {
  setHeader('Prome', null, `<button class="icon-btn" id="menuBtn" aria-label="Opciones">⋯</button>`, true);
  let html = `<div class="hello"><div class="hello-t">¡Hola! 👋</div><div class="hello-s">Tus notas, bajo control ✨</div></div>
    <div class="list-title">🗓️ Mis ciclos</div>`;
  if (!state.cycles.length) {
    html += `<div class="empty"><div class="big">🗓️</div><p><b>Aún no tienes ciclos</b></p>
      <p class="muted">Crea tu ciclo actual (por ejemplo, 2026-2) y dentro agrega tus cursos. 🚀</p></div>`;
  } else {
    html += `<div class="list">${state.cycles.map((y, i) => {
      const n = y.courses.length;
      const closed = y.courses.filter(c => c.closed).length;
      const ok = y.courses.filter(c => { const r = calc(c); return r.status.k === 'ok'; }).length;
      return `<div class="cycle-row pop" style="--c:${colorAt(i)}" data-go="#/ciclo/${y.id}">
        <div class="cy-main"><div class="cy-name">${esc(y.name)}</div>
          <div class="cy-meta"><span>📚 ${n} curso${n === 1 ? '' : 's'}</span><span>✅ ${ok} aprobado${ok === 1 ? '' : 's'}</span>${closed ? `<span>🎓 ${closed} cerrado${closed === 1 ? '' : 's'}</span>` : ''}</div></div>
        <button class="cy-edit" data-edit="${y.id}" aria-label="Editar nombre">✏️</button>
        <span class="chev">›</span></div>`;
    }).join('')}</div>`;
  }
  $('#app').innerHTML = html;
  setFab('＋ Nuevo ciclo', () => cycleModal(null));
  $('#app').querySelectorAll('[data-go]').forEach(el => el.onclick = e => {
    const ed = e.target.closest('[data-edit]');
    if (ed) { e.stopPropagation(); cycleModal(findCycle(ed.dataset.edit)); return; }
    location.hash = el.dataset.go;
  });
  $('#menuBtn').onclick = () => optionsMenu(null);
}

function cycleModal(y) {
  modal({
    title: y ? 'Editar ciclo' : 'Nuevo ciclo',
    body: `<label>Nombre<input id="cyName" placeholder="Ej. 2026-2" autocomplete="off" value="${y ? esc(y.name) : ''}"></label>`,
    actions: [
      ...(y ? [{ t: 'Eliminar', danger: true, fn: () => {
        modal({
          title: '¿Eliminar ciclo?',
          body: `<p>Se borrará <b>${esc(y.name)}</b> con sus ${y.courses.length} curso(s) y todas sus notas. No se puede deshacer.</p>`,
          actions: [{ t: 'Cancelar' }, { t: 'Eliminar', danger: true, fn: () => {
            state.cycles = state.cycles.filter(x => x !== y); save(); location.hash = '#/'; route();
          } }]
        });
      } }] : [{ t: 'Cancelar' }]),
      { t: y ? 'Guardar' : 'Crear', primary: true, fn: () => {
        const name = $('#cyName').value.trim();
        if (!name) { toast('Escribe un nombre'); return false; }
        if (y) { y.name = name; save(); route(); }
        else { const ny = { id: uid(), name, courses: [] }; state.cycles.push(ny); save(); location.hash = `#/ciclo/${ny.id}`; }
      } }
    ]
  });
}

/* ============ Ciclo: mis cursos ============ */
function renderCycle(y) {
  setHeader(y.name, '#/', `<button class="icon-btn" id="menuBtn" aria-label="Opciones">⋯</button>
    <button class="icon-btn" id="cycleCfg" aria-label="Editar ciclo">⚙︎</button>`);
  let html = `<button class="cycle-title" id="cycleTitle">✏️ Toca para cambiar el nombre del ciclo</button><div class="list-title">📚 Mis cursos</div>`;
  if (!y.courses.length) {
    html += `<div class="empty"><div class="big">📚</div><p><b>Aún no tienes cursos en este ciclo</b></p>
      <p class="muted">Crea uno y configura sus evaluaciones y pesos.</p></div>`;
  } else {
    html += `<div class="list">${y.courses.map((c, i) => {
      const r = calc(c);
      if (c.closed) {
        return `<a class="course-row closed pop" style="--c:${colorAt(i)}" href="#/curso/${c.id}">
          <div class="cr-top"><span class="cr-name">🎓 ${esc(c.name)}</span><span class="chip ${r.status.k}">${r.status.t}</span></div>
          <div class="cr-meta"><span>Curso cerrado</span><span>Nota final: <b>${fmt(r.filledPts)}</b></span></div></a>`;
      }
      return `<a class="course-row pop" style="--c:${colorAt(i)}" href="#/curso/${c.id}">
        <div class="cr-top"><span class="cr-name">${esc(c.name)}</span><span class="chip ${r.status.k}">${r.status.t}</span></div>
        <div class="bar ${r.status.k === 'ok' ? 'ok' : ''}"><div style="width:${r.progress * 100}%"></div></div>
        <div class="cr-meta"><span>${fmt(r.progress * 100, 0)}% de aprobado</span>
        <span>Asegurado: ${fmt(r.lockedPts)} / ${fmt(c.pass)}</span></div></a>`;
    }).join('')}</div>`;
  }
  $('#app').innerHTML = html;
  setFab('＋ Nuevo curso', () => addCourse(y));
  $('#menuBtn').onclick = () => optionsMenu(y);
  $('#cycleCfg').onclick = () => cycleModal(y);
  $('#cycleTitle').onclick = () => cycleModal(y);
}

function addCourse(y) {
  modal({
    title: 'Nuevo curso',
    body: `<label>Nombre del curso<input id="ncName" placeholder="Ej. Cálculo I" autocomplete="off"></label>
      <div class="row2"><label>Nota máxima<input id="ncMax" inputmode="decimal" value="20"></label>
      <label>Nota para aprobar<input id="ncPass" inputmode="decimal" value="10.5"></label></div>`,
    actions: [{ t: 'Cancelar' }, { t: 'Siguiente ›', primary: true, fn: () => {
      const name = $('#ncName').value.trim();
      const max = parseNum($('#ncMax').value), pass = parseNum($('#ncPass').value);
      if (!name) { toast('Escribe un nombre'); return false; }
      if (!(max > 0) || !(pass > 0) || pass > max) { toast('Revisa la nota máxima y la aprobatoria'); return false; }
      // Aún no se guarda: solo se guarda al tocar "Guardar"
      draft = { cycleId: y.id, course: { id: uid(), name, max, pass, items: [], closed: false } };
      location.hash = '#/nuevo';
    } }]
  });
}

/* ============ Importar / Exportar ============ */
let importTarget = null;   // ciclo donde se agregan los cursos importados (null = según el archivo)
function optionsMenu(y) {
  modal({
    title: 'Opciones',
    body: `<div class="tiles">
      <button class="tile" id="tImport"><span class="ti">📥</span><b>Importar</b><small>Agrega cursos desde un archivo. No se borra nada de lo que ya tienes.</small></button>
      <button class="tile" id="tExport"><span class="ti">📤</span><b>Exportar</b><small>Elige cursos y descárgalos, con o sin notas.</small></button>
    </div>`,
    actions: []
  });
  $('#tImport').onclick = () => { closeModal(); importTarget = y; $('#importFile').click(); };
  $('#tExport').onclick = () => exportPicker(y);
}

function exportPicker(y) {
  const cycles = (y ? [y] : state.cycles).filter(x => x.courses.length);
  if (!cycles.length) { toast('No tienes cursos para exportar'); return; }
  modal({
    title: 'Exportar cursos',
    body: `<p class="muted small">Selecciona los cursos que quieres exportar.</p>
      <label class="check all"><input type="checkbox" id="exAll"><span>Seleccionar todos</span></label>
      <div class="check-list">${cycles.map(cy => `
        ${cycles.length > 1 || !y ? `<div class="check-head">🗓️ ${esc(cy.name)}</div>` : ''}
        ${cy.courses.map(c => `<label class="check"><input type="checkbox" class="exC" value="${c.id}"><span>${esc(c.name)}${c.closed ? ' 🎓' : ''}</span></label>`).join('')}
      `).join('')}</div>`,
    actions: [{ t: 'Cancelar' }, { t: 'Siguiente', primary: true, fn: () => {
      const ids = [...document.querySelectorAll('.exC:checked')].map(i => i.value);
      if (!ids.length) { toast('Selecciona al menos un curso'); return false; }
      askGrades(ids.map(findCourse));
    } }]
  });
  const all = $('#exAll');
  all.onchange = () => document.querySelectorAll('.exC').forEach(i => i.checked = all.checked);
  document.querySelectorAll('.exC').forEach(i => i.onchange = () => {
    const xs = [...document.querySelectorAll('.exC')]; all.checked = xs.every(x => x.checked);
  });
}

function askGrades(courses) {
  modal({
    title: '¿Con notas o sin notas?',
    body: `<p class="muted small">${courses.length} curso${courses.length === 1 ? '' : 's'} seleccionado${courses.length === 1 ? '' : 's'}.</p>
      <div class="tiles">
        <button class="tile" id="gWith"><span class="ti">📝</span><b>Con notas</b><small>Copia completa, ideal como respaldo o para otro dispositivo.</small></button>
        <button class="tile" id="gWithout"><span class="ti">📋</span><b>Sin notas</b><small>Solo nombres y pesos, para compartir el formato.</small></button>
      </div>`,
    actions: []
  });
  $('#gWith').onclick = () => { closeModal(); exportCourses(courses, true); };
  $('#gWithout').onclick = () => { closeModal(); exportCourses(courses, false); };
}

function serializeCourse(c, withGrades) {
  const ser = n => {
    const o = { name: n.name, weight: n.weight, children: (n.children || []).map(ser) };
    if (withGrades && isLeaf(n) && hasGrade(n)) { o.grade = n.grade; o.locked = !!n.locked; }
    return o;
  };
  return { name: c.name, max: c.max, pass: c.pass, closed: withGrades ? !!c.closed : false, items: c.items.map(ser) };
}
function exportCourses(courses, withGrades) {
  const groups = [];
  for (const c of courses) {
    const y = cycleOf(c);
    let g = groups.find(x => x.y === y);
    if (!g) groups.push(g = { y, courses: [] });
    g.courses.push(serializeCourse(c, withGrades));
  }
  const data = { type: 'prome', version: 2, withGrades, exportedAt: new Date().toISOString(),
    cycles: groups.map(g => ({ name: g.y ? g.y.name : 'Importados', courses: g.courses })) };
  const name = courses.length === 1
    ? `${safeFile(courses[0].name)}${withGrades ? '' : '-formato'}.json`
    : `prome-${withGrades ? 'con-notas' : 'formato'}-${new Date().toISOString().slice(0, 10)}.json`;
  downloadJSON(data, name);
  toast(`Exportado${courses.length === 1 ? '' : 's'} ${courses.length} curso${courses.length === 1 ? '' : 's'}`);
}
function downloadJSON(obj, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function buildCourse(t) {
  const build = n => {
    const node = newNode(String(n.name ?? 'Evaluación'), Number(n.weight) || 0);
    node.children = Array.isArray(n.children) ? n.children.map(build) : [];
    if (!node.children.length && n.grade != null && isFinite(Number(n.grade))) { node.grade = Number(n.grade); node.locked = !!n.locked; }
    return node;
  };
  const max = Number(t.max) > 0 ? Number(t.max) : 20;
  const pass = Number(t.pass) > 0 ? Number(t.pass) : 10.5;
  return { id: uid(), name: String(t.name || 'Curso importado'), max, pass, closed: !!t.closed, items: (t.items || []).map(build) };
}
const safeFile = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'curso';

/* Lee cualquier formato (nuevo, curso suelto o respaldo antiguo) y devuelve [{cycle, course}] */
function parseImport(s) {
  const out = [];
  if (!s || typeof s !== 'object') return out;
  if (Array.isArray(s.cycles)) s.cycles.forEach(cy => (cy.courses || []).forEach(c => out.push({ cycle: cy.name, course: c })));
  else if (Array.isArray(s.courses)) s.courses.forEach(c => out.push({ cycle: null, course: c }));
  else if (Array.isArray(s.items)) out.push({ cycle: null, course: s });
  return out;
}
function getOrCreateCycle(name) {
  let y = state.cycles.find(x => x.name.trim().toLowerCase() === String(name).trim().toLowerCase());
  if (!y) { y = { id: uid(), name: String(name), courses: [] }; state.cycles.push(y); }
  return y;
}
$('#importFile').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length) return;
  let count = 0, bad = 0, lastCycle = null;
  for (const f of files) {
    let s;
    try { s = JSON.parse(await f.text()); } catch (err) { bad++; continue; }
    const entries = parseImport(s);
    if (!entries.length) { bad++; continue; }
    for (const { cycle, course } of entries) {
      const y = importTarget || getOrCreateCycle(cycle || 'Importados');
      y.courses.push(buildCourse(course)); count++; lastCycle = y;
    }
  }
  save();
  if (count) {
    toast(`Se importaron ${count} curso${count === 1 ? '' : 's'}${bad ? ` · ${bad} archivo(s) no válido(s)` : ''}`);
    if (!importTarget && lastCycle && state.cycles.length) route(); else route();
  } else toast('Archivo no válido');
});

/* ============ Curso: ingresar notas ============ */
function renderCourse(c) {
  const y = cycleOf(c);
  setHeader(c.name, y ? `#/ciclo/${y.id}` : '#/', c.closed
    ? `<button class="icon-btn" id="closedCfg" aria-label="Opciones del curso">⚙︎</button>`
    : `<a class="icon-btn" href="#/curso/${c.id}/config" aria-label="Configurar">⚙︎</a>`);
  const issues = c.closed ? [] : weightIssues(c.items);
  let html = '';
  if (c.closed) {
    const r = calc(c), ok = r.filledPts >= c.pass - 1e-9;
    html += `<div class="closed-banner ${ok ? 'ok' : 'bad'}"><span class="big">🎓</span><div><b>Curso cerrado</b>
      <div>Nota final <b>${fmt(r.filledPts)}</b> · ${ok ? 'Aprobado ✅' : 'Desaprobado ❌'}</div></div></div>`;
  }
  html += `<section class="summary" id="summary"></section>`;
  if (issues.length) {
    html += `<div class="alert warn">⚠️ Los pesos no suman 100% en: ${issues.map(i => `<b>${esc(i.label)}</b> (${fmt(i.sum)}%)`).join(', ')}.
      Los cálculos no serán correctos. <a href="#/curso/${c.id}/config">Corregir</a></div>`;
  }
  if (!c.items.length) {
    html += `<div class="empty"><p>Este curso aún no tiene evaluaciones.</p>
      <a class="btn primary" href="#/curso/${c.id}/config">Configurar evaluaciones</a></div>`;
  } else {
    html += `<div class="tree">${c.items.map((n, i) => gradeNodeHTML(n, 1, colorAt(i))).join('')}</div>
      ${c.closed ? '' : `<p class="muted small" style="margin-top:14px">🔒 Nota oficial asegurada · 🔓 Nota de prueba (simulación). Toca 🔓 para asegurar una nota que ya te dieron.</p>`}`;
  }
  $('#app').innerHTML = html;
  updateLive(c);

  if (c.closed) {
    $('#closedCfg').onclick = () => modal({
      title: 'Curso cerrado',
      body: `<p>Este curso está cerrado y sus notas no se pueden cambiar.</p><p class="muted small">Si necesitas corregir algo, puedes reabrirlo.</p>`,
      actions: [{ t: 'Cancelar' }, { t: 'Reabrir curso', danger: true, fn: () => {
        c.closed = false; save(); keepScroll(() => renderCourse(c)); toast('Curso reabierto');
      } }]
    });
    $('#app').querySelectorAll('input.grade').forEach(inp => {
      inp.readOnly = true; inp.classList.add('is-locked');
      inp.addEventListener('focus', () => inp.blur());
    });
    $('#app').querySelectorAll('[data-lock]').forEach(b => b.onclick = () => toast('El curso está cerrado 🎓'));
    return;
  }

  $('#app').querySelectorAll('input.grade').forEach(inp => {
    inp.addEventListener('input', () => {
      const { node } = findNode(c.items, inp.dataset.id);
      if (node.locked) return;
      const v = parseNum(inp.value);
      const bad = v != null && (isNaN(v) || v < 0 || v > c.max);
      inp.classList.toggle('invalid', bad);
      node.grade = (v == null || bad) ? null : v;
      save(); updateLive(c);
    });
  });
  // Nota asegurada: tocar el recuadro no deja cambiarla
  $('#app').querySelectorAll('input.grade.is-locked').forEach(inp => {
    inp.addEventListener('focus', () => inp.blur());
    inp.addEventListener('click', () => toast('Nota asegurada 🔒 · Mantén presionado el candado 1 s para cambiarla'));
  });
  $('#app').querySelectorAll('[data-lock]').forEach(b => {
    const { node } = findNode(c.items, b.dataset.lock);
    if (!node.locked) {
      // Un toque: asegurar
      b.onclick = () => {
        if (node.grade == null) { toast('Primero escribe la nota que te dieron'); return; }
        node.locked = true; save();
        if (navigator.vibrate) navigator.vibrate(20);
        keepScroll(() => renderCourse(c));
      };
    } else {
      // Mantener presionado 1 s: desbloquear
      holdButton(b, 1000, () => {
        node.locked = false; save();
        if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
        keepScroll(() => renderCourse(c));
        toast('Nota desbloqueada');
      }, () => toast('Mantén presionado 1 s para desbloquear'));
    }
  });
}

function holdButton(el, ms, onDone, onShort) {
  let t = null, start = 0;
  el.style.setProperty('--hold', ms + 'ms');
  const cancel = () => {
    if (!t) return;
    clearTimeout(t); t = null; el.classList.remove('holding');
    if (Date.now() - start < 350 && onShort) onShort();
  };
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    start = Date.now(); el.classList.add('holding');
    t = setTimeout(() => { t = null; el.classList.remove('holding'); onDone(); }, ms);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function gradeNodeHTML(n, factor, color = null) {
  const cs = color ? ` style="--c:${color}"` : '';
  const ew = factor * (Number(n.weight) || 0) / 100;
  const wInfo = `${fmt(n.weight)}%${factor !== 1 ? ` · ${fmt(ew * 100)}% del curso` : ''}`;
  if (isLeaf(n)) {
    return `<div class="leaf ${n.locked ? 'locked' : ''}${color ? ' blk' : ''}"${cs}>
      <div class="leaf-info"><div class="leaf-name">${esc(n.name)}</div><div class="leaf-w">${wInfo}</div>
      <div class="need" data-need="${n.id}"></div></div>
      <input data-id="${n.id}" inputmode="decimal" autocomplete="off" placeholder="—"
        value="${n.grade != null ? n.grade : ''}" ${n.locked ? 'readonly tabindex="-1"' : ''} class="grade${n.locked ? ' is-locked' : ''}" aria-label="Nota de ${esc(n.name)}">
      <button class="lock-btn${n.locked ? ' on' : ''}" data-lock="${n.id}" aria-label="${n.locked ? 'Asegurada: mantén presionado para desbloquear' : 'Asegurar'}">${n.locked ? '🔒' : '🔓'}</button>
    </div>`;
  }
  return `<div class="group${color ? ' blk' : ''}"${cs}>
    <div class="group-head"><div><div class="group-name">${esc(n.name)}</div><div class="leaf-w">${wInfo}</div></div>
    <div class="group-val" data-gv="${n.id}"></div></div>
    <div class="group-body">${n.children.map(ch => gradeNodeHTML(ch, ew)).join('')}</div>
  </div>`;
}

function updateLive(c) {
  const r = calc(c);
  const sum = $('#summary'); if (!sum) return;
  const finalDone = r.ls.length && r.emptyW <= 1e-9;
  const msgs = [];
  if (r.ls.length && !c.closed) {
    if (r.status.k === 'ok') msgs.push(['ok', `🎉 Ya aseguraste el aprobado. Aunque saques ${fmt(0)} en lo que falta, apruebas.`]);
    else if (r.remW <= 1e-9) msgs.push(['bad', `Todas las notas están aseguradas. Nota final: <b>${fmt(r.lockedPts)}</b>.`]);
    else if (r.needLocked > c.max + 1e-9) msgs.push(['bad', `Necesitarías un promedio de <b>${fmt(r.needLocked)}</b> en el ${fmt(r.remW * 100)}% restante, pero el máximo es ${fmt(c.max)}. Ya no es posible aprobar.`]);
    else msgs.push([r.status.k === 'warn' ? 'warn' : '', `Necesitas un promedio de <b>${fmt(r.needLocked)}</b> en el ${fmt(r.remW * 100)}% del curso que aún no está asegurado.`]);
    const hasSim = r.filledW - r.lockedW > 1e-9;
    if (hasSim && r.emptyW > 1e-9 && r.status.k !== 'ok') {
      if (r.needEmpty <= 0) msgs.push(['ok', `Con tus notas de prueba ya llegarías a aprobar, aunque saques 0 en lo que dejaste vacío.`]);
      else if (r.needEmpty > c.max) msgs.push(['bad', `Con tus notas de prueba no alcanzas: en lo vacío necesitarías <b>${fmt(r.needEmpty)}</b>.`]);
      else msgs.push(['', `Con tus notas de prueba, en lo que dejaste vacío (${fmt(r.emptyW * 100)}%) necesitas un promedio de <b>${fmt(r.needEmpty)}</b>.`]);
    }
    if (finalDone && hasSim) {
      const ok = r.filledPts >= c.pass - 1e-9;
      msgs.push([ok ? 'ok' : 'bad', `Con esta simulación tu nota final sería <b>${fmt(r.filledPts)}</b>: ${ok ? 'apruebas ✅' : 'no apruebas ❌'}.`]);
    }
  }
  sum.innerHTML = `<div class="hero">
    <div class="sum-top"><div><div class="label">🎯 Vas de aprobado</div><div class="bigpct">${fmt(r.progress * 100, 0)}%</div></div>
      <span class="chip ${r.status.k}">${r.status.t}</span></div>
    <div class="bar ${r.status.k === 'ok' ? 'ok' : ''}"><div style="width:${r.progress * 100}%"></div></div>
    <div class="stats">
      <div><span>Asegurado</span><b>${fmt(r.lockedPts)}</b><small>de ${fmt(c.pass)} para aprobar</small></div>
      <div><span>${finalDone ? 'Nota final' : 'Acumulado'}</span><b>${r.ls.length ? fmt(r.filledPts) : '—'}</b>
        <small>${finalDone ? 'según secciones redondeadas' : `faltan ${fmt(r.emptyW * 100)}%`}</small></div>
      <div><span>Evaluado</span><b>${fmt(r.lockedW * 100, 0)}%</b><small>asegurado del curso</small></div>
    </div></div>
    ${r.heads.length ? `<div class="heads-title">📊 Notas por sección</div><div class="heads">${r.heads.map((h, hi) => {
      let cls = 'partial', val = '—', sub = 'sin notas';
      if (h.complete) {
        cls = h.rounded >= c.pass - 1e-9 ? 'ok' : 'bad';
        val = fmt(h.rounded, 0);
        sub = h.lockedAll ? '🔒 asegurada' : 'con notas de prueba';
      } else if (h.raw != null) {
        val = fmt(roundHalf(h.raw), 0);
        sub = `parcial · ${fmt(h.frac * 100, 0)}% lleno`;
      }
      return `<div class="head-card ${cls}" style="--c:${colorAt(hi)}"><div class="hc-name">${esc(h.n.name)}</div><div class="hc-w">${fmt(Number(h.n.weight) || 0)}% del curso</div>
        <div class="hc-val">${val}</div><div class="hc-sub">${sub}</div></div>`;
    }).join('')}</div>` : ''}
    ${msgs.map(([k, t]) => `<div class="need-msg ${k}">${t}</div>`).join('')}`;

  // Pista en cada evaluación vacía
  for (const { node } of r.ls) {
    const el = document.querySelector(`[data-need="${node.id}"]`); if (!el) continue;
    if (node.grade != null || r.needEmpty == null) { el.textContent = ''; el.className = 'need'; continue; }
    if (r.needEmpty <= 0) { el.textContent = 'Ya cubierto ✓'; el.className = 'need ok'; }
    else if (r.needEmpty > c.max) { el.textContent = `Necesitarías ${fmt(r.needEmpty)} (no alcanza)`; el.className = 'need bad'; }
    else { el.textContent = `Necesitas ≥ ${fmt(r.needEmpty)}`; el.className = 'need'; }
  }
  // Promedio de cada grupo
  document.querySelectorAll('[data-gv]').forEach(el => {
    const { node } = findNode(c.items, el.dataset.gv);
    const g = groupValue(node);
    if (g.val == null) el.innerHTML = `—<small>sin notas</small>`;
    else if (g.frac >= 1 - 1e-9) el.innerHTML = `${fmt(g.val)}<small>promedio</small>`;
    else el.innerHTML = `${fmt(g.val)}<small>parcial · ${fmt(g.frac * 100, 0)}% lleno</small>`;
  });
}

/* ============ Configuración del curso ============ */
function renderConfig(c) {
  const isDraft = !!(draft && draft.course === c);
  setHeader(isDraft ? 'Nuevo curso' : 'Configurar curso', isDraft ? `#/ciclo/${draft.cycleId}` : `#/curso/${c.id}`);
  $('#app').innerHTML = `
    <section class="card">
      <label>Nombre del curso<input id="cName" value="${esc(c.name)}" autocomplete="off"></label>
      <div class="row2">
        <label>Nota máxima<input id="cMax" inputmode="decimal" value="${c.max}"></label>
        <label>Nota para aprobar<input id="cPass" inputmode="decimal" value="${c.pass}"></label>
      </div>
    </section>
    <h2 class="section-title">Evaluaciones y pesos</h2>
    <p class="muted small">Cada grupo debe sumar 100%. Usa <b>Subdividir</b> para que una evaluación se calcule a partir de otras internas (solo las de último nivel llevarán nota).</p>
    ${c.items.length ? cfgListHTML(c.items, 'root') : `<div class="start-card pop"><div class="big">🚀</div>
      <b>¡Arma tu curso!</b><p class="muted small">Empieza con tu primera evaluación y luego agrega las demás.</p>
      <button class="btn grad" id="startBtn">✨ Empezar</button></div>`}
    ${c.items.length ? `<p class="muted small" style="margin-top:12px">↕️ Mantén presionado un bloque (o arrastra desde ⠿) para moverlo arriba o abajo.</p>` : ''}
    ${!isDraft && isComplete(c) ? `<div class="close-box"><div><b>🎓 Todas las notas están llenas</b><div class="muted small">Puedes cerrar el curso: se aseguran todas las notas y queda con su nota final.</div></div>
      <button class="btn close-btn" id="closeCourse">Cerrar curso</button></div>` : ''}
    <button class="btn grad block" id="saveCourse">💾 Guardar</button>
    ${isDraft ? '' : `<div class="danger-zone"><button class="btn danger sm" id="delCourse">🗑️ Eliminar curso</button></div>`}`;
  updateSums(c);

  $('#cName').oninput = e => { c.name = e.target.value.trim() || 'Sin nombre'; save(); };
  $('#cMax').oninput = e => { const v = parseNum(e.target.value); if (v > 0) { c.max = v; save(); } };
  $('#cPass').oninput = e => { const v = parseNum(e.target.value); if (v > 0) { c.pass = v; save(); } };

  const app = $('#app');
  app.querySelectorAll('[data-name]').forEach(inp => inp.oninput = () => {
    findNode(c.items, inp.dataset.name).node.name = inp.value; save();
  });
  app.querySelectorAll('[data-w]').forEach(inp => inp.oninput = () => {
    const v = parseNum(inp.value);
    findNode(c.items, inp.dataset.w).node.weight = (v == null || isNaN(v)) ? 0 : v;
    save(); updateSums(c);
  });
  app.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const list = getList(c, b.dataset.add);
    const rest = Math.max(0, round2(100 - sumW(list)));
    // Primera capa: nombre genérico (son secciones distintas). Capas internas: sigue la numeración.
    const name = b.dataset.add === 'root' ? `Evaluación ${list.length + 1}` : nextName(list);
    list.push(newNode(name, rest));
    save(); keepScroll(() => renderConfig(c));
  });
  app.querySelectorAll('[data-split]').forEach(b => b.onclick = () => {
    const list = getList(c, b.dataset.split);
    const w = 100 / list.length;
    modal({
      title: 'Repartir peso igual',
      body: `<p>¿Asignar <b>${fmt(w)}%</b> a cada una de las ${list.length} evaluaciones de este grupo?</p>`,
      actions: [{ t: 'Cancelar' }, { t: 'Aplicar', primary: true, fn: () => {
        list.forEach(n => n.weight = w); save(); keepScroll(() => renderConfig(c));
      } }]
    });
  });
  app.querySelectorAll('[data-divide]').forEach(b => b.onclick = () => {
    const { node } = findNode(c.items, b.dataset.divide);
    node.grade = null; node.locked = false;
    const base = String(node.name || '').trim() || 'Evaluación';
    node.children.push(newNode(`${base} 1`, 100));
    save(); keepScroll(() => renderConfig(c));
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const f = findNode(c.items, b.dataset.del);
    const doDel = () => { f.list.splice(f.list.indexOf(f.node), 1); save(); keepScroll(() => renderConfig(c)); };
    if (!isLeaf(f.node) || hasLocked(f.node)) {
      modal({
        title: '¿Eliminar evaluación?',
        body: `<p>Se eliminará <b>${esc(f.node.name)}</b>${!isLeaf(f.node) ? ' y todas sus evaluaciones internas' : ''}${hasLocked(f.node) ? ', <b>incluidas notas aseguradas</b>' : ''}.</p>`,
        actions: [{ t: 'Cancelar' }, { t: 'Eliminar', danger: true, fn: doDel }]
      });
    } else doDel();
  });
  const cc = $('#closeCourse');
  if (cc) cc.onclick = () => {
    const r = calc(c), ok = r.filledPts >= c.pass - 1e-9;
    modal({
      title: '¿Cerrar curso?',
      body: `<p>Nota final: <b>${fmt(r.filledPts)}</b> · ${ok ? 'Aprobado ✅' : 'Desaprobado ❌'}</p>
        <p class="muted small">Se asegurarán todas las notas y el curso quedará cerrado. Podrás reabrirlo desde la tuerca si lo necesitas.</p>`,
      actions: [{ t: 'Cancelar' }, { t: 'Cerrar curso', primary: true, fn: () => {
        leaves(c.items).forEach(({ node }) => { if (hasGrade(node)) node.locked = true; });
        c.closed = true; save(); location.hash = `#/curso/${c.id}`; toast('Curso cerrado 🎓');
      } }]
    });
  };
  enableReorder(c);
  const st = $('#startBtn');
  if (st) st.onclick = () => { c.items = [newNode('Examen Final', 100)]; save(); keepScroll(() => renderConfig(c)); };
  $('#saveCourse').onclick = () => {
    if (!c.name.trim()) { toast('Ponle un nombre al curso'); return; }
    if (isDraft) {
      const y = findCycle(draft.cycleId);
      if (!y) { toast('El ciclo ya no existe'); return; }
      y.courses.push(c); draft = null; save();
      toast('Curso guardado 🎉');
    } else { save(); toast('Guardado 💾'); }
    location.hash = `#/curso/${c.id}`;
  };
  const dc = $('#delCourse');
  if (dc) dc.onclick = () => modal({
    title: '¿Eliminar curso?',
    body: `<p>Se borrará <b>${esc(c.name)}</b> con todas sus notas. No se puede deshacer.</p>`,
    actions: [{ t: 'Cancelar' }, { t: 'Eliminar', danger: true, fn: () => {
      const y = cycleOf(c); if (y) y.courses = y.courses.filter(x => x !== c); save(); location.hash = y ? `#/ciclo/${y.id}` : '#/';
    } }]
  });
}

/* Mantener presionado un bloque y moverlo arriba/abajo (se mueve con todo lo que tiene dentro) */
let reorderCourse = null, reorderReady = false;
function enableReorder(course) {
  reorderCourse = course;
  if (reorderReady) return;   // los eventos se instalan una sola vez
  reorderReady = true;
  const app = $('#app'), scroller = $('#scroller');
  let drag = null, pressT = null, sx = 0, sy = 0, lastY = 0, raf = 0;

  const siblingsOf = el => [...el.parentElement.children].filter(e => e.classList.contains('cfg-node'));
  function begin(nodeEl) {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    drag = { el: nodeEl, list: nodeEl.parentElement };
    nodeEl.classList.add('dragging');
    document.body.classList.add('is-dragging');
    if (navigator.vibrate) navigator.vibrate(25);
    autoScroll();
  }
  function move(y) {
    lastY = y;
    if (!drag) return;
    const others = siblingsOf(drag.el).filter(e => e !== drag.el);
    let idx = 0;
    for (const o of others) { const r = o.getBoundingClientRect(); if (y > r.top + r.height / 2) idx++; }
    const ref = others[idx] || drag.list.querySelector(':scope > .cfg-foot');
    if (ref !== drag.el.nextElementSibling) drag.list.insertBefore(drag.el, ref);
  }
  function autoScroll() {
    if (!drag) return;
    const h = window.innerHeight;
    if (lastY < 90) scroller.scrollTop -= 12; else if (lastY > h - 90) scroller.scrollTop += 12;
    move(lastY);
    raf = requestAnimationFrame(autoScroll);
  }
  function end() {
    clearTimeout(pressT); pressT = null;
    if (!drag) return;
    cancelAnimationFrame(raf);
    const pid = drag.list.dataset.pid;
    const order = siblingsOf(drag.el).map(e => e.dataset.id);
    const c = reorderCourse;
    const list = getList(c, pid);
    list.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    drag.el.classList.remove('dragging');
    document.body.classList.remove('is-dragging');
    drag = null;
    save(); keepScroll(() => renderConfig(c));
  }
  function headOf(target) {
    if (!/\/config$|^#\/nuevo/.test(location.hash)) return null;
    const head = target.closest('.cfg-head');
    if (!head || !app.contains(head)) return null;
    const isGrip = !!target.closest('.grip');
    if (!isGrip && target.closest('input,button')) return null; // en inputs/botones no
    return { nodeEl: head.parentElement, isGrip };
  }

  // Táctil: mantener presionado ~0.4 s (o el ⠿) y deslizar
  app.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    const h = headOf(e.target); if (!h) return;
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; lastY = sy;
    pressT = setTimeout(() => begin(h.nodeEl), h.isGrip ? 150 : 400);
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    const t = e.touches[0]; if (!t) return;
    if (drag) { e.preventDefault(); move(t.clientY); return; }
    if (pressT && (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10)) { clearTimeout(pressT); pressT = null; }
  }, { passive: false });
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
  app.addEventListener('contextmenu', e => { if (e.target.closest('.cfg-head') && !e.target.closest('input')) e.preventDefault(); });

  // Mouse (computadora): arrastrar desde ⠿ o mantener presionado el bloque
  app.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    const h = headOf(e.target); if (!h) return;
    lastY = e.clientY; sx = e.clientX; sy = e.clientY;
    if (h.isGrip) { e.preventDefault(); begin(h.nodeEl); } else pressT = setTimeout(() => begin(h.nodeEl), 400);
  });
  document.addEventListener('mousemove', e => {
    if (drag) { e.preventDefault(); move(e.clientY); }
    else if (pressT && (Math.abs(e.clientX - sx) > 6 || Math.abs(e.clientY - sy) > 6)) { clearTimeout(pressT); pressT = null; }
  });
  document.addEventListener('mouseup', end);
}

function cfgListHTML(list, pid) {
  return `<div class="cfg-list ${pid === 'root' ? 'root' : ''}" data-pid="${pid}">
    ${list.map((n, i) => cfgNodeHTML(n, pid === 'root' ? colorAt(i) : null)).join('')}
    <div class="cfg-foot"><span class="sum" data-sum="${pid}"></span>
      <div class="cfg-foot-btns">
        ${list.length > 1 ? `<button class="btn sm" data-split="${pid}">Repartir igual</button>` : ''}
        <button class="btn sm" data-add="${pid}">+ Agregar</button>
      </div></div>
  </div>`;
}
function cfgNodeHTML(n, color) {
  return `<div class="cfg-node${color ? ' blk' : ''}" data-id="${n.id}"${color ? ` style="--c:${color}"` : ''}>
    <div class="cfg-head">
    <div class="cfg-row">
      <span class="grip" aria-label="Mover">⠿</span>
      <input class="cfg-name" data-name="${n.id}" value="${esc(n.name)}" placeholder="Nombre" autocomplete="off">
      <div class="pct"><input class="cfg-w" data-w="${n.id}" inputmode="decimal" value="${round2(Number(n.weight) || 0)}"><span>%</span></div>
    </div>
    <div class="cfg-actions">
      ${n.locked ? `<span class="tag">🔒 Nota asegurada: ${fmt(n.grade)}</span>` : isLeaf(n) ? `<button class="link" data-divide="${n.id}">↳ Subdividir</button>` : ''}
      <button class="link danger" data-del="${n.id}">Eliminar</button>
    </div>
    </div>
    ${!isLeaf(n) ? cfgListHTML(n.children, n.id) : ''}
  </div>`;
}
function updateSums(c) {
  const check = (list, pid) => {
    const el = document.querySelector(`[data-sum="${pid}"]`);
    if (el) {
      if (!list.length) { el.textContent = ''; }
      else {
        const s = sumW(list), ok = Math.abs(s - 100) <= EPS;
        el.className = 'sum ' + (ok ? 'ok' : 'bad');
        el.textContent = ok ? '✓ Suma 100%' : `⚠️ Suman ${fmt(s)}%, deben sumar 100%`;
      }
    }
    list.forEach(n => { if (!isLeaf(n)) check(n.children, n.id); });
  };
  check(c.items, 'root');
}
function exampleTemplate() {
  const eas = () => [1, 2, 3, 4, 5].map(i => newNode(`EA${i}`, 20));
  const ec1 = newNode('Evaluaciones continuas 1', 50); ec1.children = eas();
  const ec2 = newNode('Evaluaciones continuas 2', 50); ec2.children = eas();
  const ec = newNode('Evaluaciones continuas', 20); ec.children = [ec1, ec2];
  return [newNode('Examen final', 40), newNode('Parcial', 40), ec];
}

/* Sin zoom (pellizcar) y solo vertical */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => {}); } catch (e) {}

/* App instalable y que funcione sin internet */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

route();
</script>
